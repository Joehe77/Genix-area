<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINI GAME — VOID PROJECT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    min-height: 100vh;
    background: #0a0a1a;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: "";
    position: fixed; inset: -50%;
    background:
      radial-gradient(circle at 20% 20%, #6a5cff 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, #ff5cc8 0%, transparent 40%),
      #0a0a1a;
    z-index: -1;
    animation: bgMove 12s ease-in-out infinite alternate;
  }
  @keyframes bgMove {
    0% { transform: translate(0,0); }
    100% { transform: translate(-3%,-3%); }
  }

  .wrap {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
    transition: transform 0.2s, background 0.2s;
  }
  .back:active { transform: scale(0.95); }
  .back:hover { background: rgba(255,255,255,0.18); }

  .title {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #fff, #b8b0ff, #ff9ce0, #fff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientFlow 4s linear infinite;
  }
  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .subtitle {
    text-align: center;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
  }
  .stat-label {
    font-size: 8px;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
  }
  .stat.gold .stat-value { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
  .stat.level .stat-value { color: #ff9ce0; text-shadow: 0 0 10px rgba(255,156,224,0.5); }
  .stat.hp .stat-value { color: #ff5c5c; text-shadow: 0 0 10px rgba(255,92,92,0.5); }

  .enemy-area {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .enemy-area::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,92,200,0.15), transparent 60%);
    pointer-events: none;
  }

  .enemy-name {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ff9ce0;
    text-transform: uppercase;
    margin-bottom: 10px;
    position: relative;
  }

  .enemy-sprite {
    width: 100px;
    height: 100px;
    margin: 10px auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: enemyIdle 2s ease-in-out infinite;
    transition: transform 0.1s;
  }
  .enemy-sprite svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 20px rgba(255,92,200,0.6));
    transition: filter 0.2s;
  }
  @keyframes enemyIdle {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.05); }
  }
  .enemy-sprite.hit {
    animation: enemyHit 0.3s ease;
  }
  @keyframes enemyHit {
    0% { transform: scale(1); }
    50% { transform: scale(0.85) rotate(-5deg); }
    100% { transform: scale(1); }
  }
  .enemy-sprite.hit svg {
    filter: drop-shadow(0 0 40px rgba(255,255,255,1)) brightness(2);
  }

  .enemy-hp-bar {
    width: 100%;
    height: 14px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
    margin-top: 8px;
    position: relative;
  }
  .enemy-hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff5c5c, #ff9c5c);
    border-radius: 10px;
    transition: width 0.3s ease;
    box-shadow: 0 0 12px rgba(255,92,92,0.6);
  }
  .enemy-hp-text {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .attack-btn {
    width: 100%;
    padding: 18px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.3);
    background: linear-gradient(135deg, #ff5c5c 0%, #ff9c5c 100%);
    background-size: 200% 200%;
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 10px 30px rgba(255,92,92,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    animation: atkFlow 3s ease infinite;
    transition: transform 0.1s, box-shadow 0.2s;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  @keyframes atkFlow {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .attack-btn:active {
    transform: scale(0.96);
    box-shadow: 0 5px 15px rgba(255,92,92,0.7), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .attack-btn svg { width: 20px; height: 20px; }

  .dmg-popup {
    position: absolute;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,92,92,1), 0 2px 4px rgba(0,0,0,0.8);
    pointer-events: none;
    animation: dmgFloat 0.9s ease-out forwards;
    z-index: 10;
  }
  @keyframes dmgFloat {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
    30% { transform: translate(-50%, -20px) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -80px) scale(0.9); }
  }

  .inv-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .inv-title::before, .inv-title::after {
    content: "";
    height: 1px;
    flex: 1;
    background: linear-gradient(90deg, transparent, rgba(180,160,255,0.6), transparent);
  }

  .inv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .inv-item {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
    cursor: pointer;
  }
  .inv-item:hover {
    transform: translateY(-3px);
    border-color: rgba(140,120,255,0.6);
    background: rgba(255,255,255,0.14);
  }
  .inv-item:active { transform: scale(0.95); }
  .inv-icon {
    width: 32px;
    height: 32px;
    margin: 0 auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 8px rgba(180,150,255,0.5));
  }
  .inv-icon svg { width: 100%; height: 100%; }
  .inv-name {
    font-size: 9px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
    font-weight: 700;
  }
  .inv-cost {
    font-size: 9px;
    color: #ffd700;
    margin-top: 4px;
    font-weight: 700;
  }
  .inv-item.owned {
    border-color: rgba(74,222,128,0.5);
    background: rgba(74,222,128,0.1);
  }
  .inv-item.owned .inv-cost {
    color: #4ade80;
  }

  .log {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    max-height: 100px;
    overflow-y: auto;
    letter-spacing: 0.5px;
    line-height: 1.6;
  }
  .log div { padding: 2px 0; }
  .log .log-dmg { color: #ff9c5c; }
  .log .log-gold { color: #ffd700; }
  .log .log-kill { color: #ff5cc8; font-weight: 700; }
  .log .log-buy { color: #4ade80; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 12px 22px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast svg { width: 16px; height: 16px; }

  @media (max-width: 360px) {
    .enemy-sprite { width: 80px; height: 80px; }
    .attack-btn { font-size: 13px; padding: 15px; }
    .title { font-size: 15px; }
  }
</style>
</head>

    </svg>`,

    excalibur: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#ffd700">
      <path d="M12 2l3 6 6 1-4.5 4 1 6L12 16l-5.5 3 1-6L3 9l6-1z"/>
      <path d="M12 8v8"/>
    </svg>`
  };

  // ===== STATE =====
  const state = {
    level: 1,
    gold: 0,
    damage: 5,
    kills: 0,
    enemy: null
  };

  // ===== ENEMY DATABASE =====
  const enemyTypes = [
    { name: 'SLIME', icon: 'slime', hp: 30, gold: 5, color: '#4ade80' },
    { name: 'GOBLIN', icon: 'goblin', hp: 50, gold: 10, color: '#ff9c5c' },
    { name: 'SKELETON', icon: 'skeleton', hp: 80, gold: 18, color: '#ddd' },
    { name: 'ORC', icon: 'orc', hp: 120, gold: 30, color: '#8ab86a' },
    { name: 'DRAGON', icon: 'dragon', hp: 200, gold: 60, color: '#ff5cc8' },
    { name: 'DEMON', icon: 'demon', hp: 350, gold: 120, color: '#a855f7' }
  ];

  // ===== SHOP ITEMS =====
  const shopItems = [
    { id: 'sword', name: 'Pedang', icon: 'sword', cost: 20, dmg: 3, bought: false },
    { id: 'axe', name: 'Kapak', icon: 'axe', cost: 50, dmg: 8, bought: false },
    { id: 'staff', name: 'Tongkat', icon: 'staff', cost: 120, dmg: 18, bought: false },
    { id: 'bow', name: 'Panah', icon: 'bow', cost: 250, dmg: 35, bought: false },
    { id: 'hammer', name: 'Hammer', icon: 'hammer', cost: 500, dmg: 60, bought: false },
    { id: 'excalibur', name: 'Excalibur', icon: 'excalibur', cost: 1200, dmg: 120, bought: false }
  ];

  // ===== SPAWN ENEMY =====
  function spawnEnemy() {
    const idx = Math.min(Math.floor((state.level - 1) / 2), enemyTypes.length - 1);
    const base = enemyTypes[idx];
    const scale = 1 + (state.level - 1) * 0.3;
    state.enemy = {
      name: base.name,
      icon: base.icon,
      maxHp: Math.floor(base.hp * scale),
      hp: Math.floor(base.hp * scale),
      gold: Math.floor(base.gold * scale),
      color: base.color
    };
    renderEnemy();
  }

  function renderEnemy() {
    const e = state.enemy;
    document.getElementById('enemyName').textContent = e.name;
    document.getElementById('enemyName').style.color = e.color;
    document.getElementById('enemySprite').innerHTML = icons[e.icon];
    document.getElementById('enemySprite').querySelector('svg').style.filter = `drop-shadow(0 0 20px ${e.color}aa)`;
    const pct = (e.hp / e.maxHp) * 100;
    document.getElementById('enemyHpFill').style.width = pct + '%';
    document.getElementById('enemyHpText').textContent = `${e.hp} / ${e.maxHp}`;
  }

  function renderStats() {
    document.getElementById('level').textContent = state.level;
    document.getElementById('gold').textContent = state.gold;
    document.getElementById('damage').textContent = state.damage;
  }

  function renderShop() {
    const grid = document.getElementById('invGrid');
    grid.innerHTML = '';
    shopItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'inv-item' + (item.bought ? ' owned' : '');
      div.innerHTML = `
        <div class="inv-icon">${icons[item.icon]}</div>
        <div class="inv-name">${item.name}</div>
        <div class="inv-cost">${item.bought ? 'DIMILIKI' : item.cost}</div>
      `;
      if (!item.bought) {
        div.onclick = () => buyItem(item);
      }
      grid.appendChild(div);
    });
  }

  function buyItem(item) {
    if (state.gold < item.cost) {
      showToast('Gold tidak cukup', 'error');
      return;
    }
    state.gold -= item.cost;
    state.damage += item.dmg;
    item.bought = true;
    addLog(`Membeli ${item.name} (+${item.dmg} dmg)`, 'log-buy');
    showToast(`${item.name} dibeli!`, 'success');
    renderStats();
    renderShop();
  }

  function attack() {
    const e = state.enemy;
    const dmg = Math.floor(state.damage * (0.9 + Math.random() * 0.2));
    e.hp = Math.max(0, e.hp - dmg);

    const sprite = document.getElementById('enemySprite');
    sprite.classList.remove('hit');
    void sprite.offsetWidth;
    sprite.classList.add('hit');

    showDamagePopup(dmg);
    addLog(`Menyerang ${e.name} — ${dmg} damage`, 'log-dmg');
    renderEnemy();

    if (e.hp <= 0) killEnemy();
  }

  function killEnemy() {
    const e = state.enemy;
    state.gold += e.gold;
    state.kills++;
    addLog(`${e.name} dikalahkan! +${e.gold} gold`, 'log-kill');
    showToast(`+${e.gold} GOLD`, 'success');

    if (state.kills % 3 === 0) {
      state.level++;
      addLog(`Naik ke level ${state.level}!`, 'log-gold');
      showToast(`LEVEL ${state.level}`, 'level');
    }

    renderStats();
    setTimeout(spawnEnemy, 400);
  }

  function showDamagePopup(dmg) {
    const area = document.getElementById('enemyArea');
    const popup = document.createElement('div');
    popup.className = 'dmg-popup';
    popup.textContent = '-' + dmg;
    popup.style.left = (30 + Math.random() * 40) + '%';
    popup.style.top = (30 + Math.random() * 20) + '%';
    area.appendChild(popup);
    setTimeout(() => popup.remove(), 900);
  }

  function addLog(text, cls = '') {
    const log = document.getElementById('log');
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = '› ' + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    while (log.children.length > 20) log.removeChild(log.firstChild);
  }

  let toastTimer;
  function showToast(text, type) {
    const t = document.getElementById('toast');
    let icon = '';
    if (type === 'success') {
      icon = `<svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    } else if (type === 'error') {
      icon = `<svg viewBox="0 0 24 24" fill="none" stroke="#ff5c5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    } else if (type === 'level') {
      icon = `<svg viewBox="0 0 24 24" fill="none" stroke="#ff9ce0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`;
    }
    t.innerHTML = icon + '<span>' + text + '</span>';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  document.getElementById('attackBtn').addEventListener('click', attack);
  renderStats();
  renderShop();
  spawnEnemy();
  addLog('Selamat datang di Mini Game!', 'log-buy');
  addLog('Klik SERANG untuk melawan musuh.', '');
</script>

</body>
