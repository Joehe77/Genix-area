<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTER MAP — VOID PROJECT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    min-height: 100vh;
    background: #0a0a1a;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: "";
    position: fixed; inset: -50%;
    background:
      radial-gradient(circle at 20% 20%, #6a5cff 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, #ff5cc8 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #00d4ff 0%, transparent 50%),
      #0a0a1a;
    z-index: -2;
    animation: bgMove 12s ease-in-out infinite alternate;
  }
  @keyframes bgMove {
    0% { transform: translate(0,0); }
    100% { transform: translate(-3%,-3%); }
  }

  .stars {
    position: fixed; inset: 0;
    z-index: -1; overflow: hidden;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
    transition: transform 0.2s, background 0.2s;
  }
  .back:active { transform: scale(0.95); }
  .back:hover { background: rgba(255,255,255,0.18); }

  .title {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #fff, #b8b0ff, #ff9ce0, #fff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientFlow 4s linear infinite, titleGlow 4s ease-in-out infinite;
  }
  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @keyframes titleGlow {
    0%,100% { filter: drop-shadow(0 0 10px rgba(106,92,255,0.6)); }
    50% { filter: drop-shadow(0 0 25px rgba(255,92,200,0.9)); }
  }

  .subtitle {
    text-align: center;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  .divider {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin: 0 0 22px;
  }
  .divider .line {
    height: 1px; flex: 1; max-width: 90px;
    background: linear-gradient(90deg, transparent, rgba(180,160,255,0.7), transparent);
    box-shadow: 0 0 8px rgba(140,120,255,0.6);
  }
  .divider .diamond {
    width: 8px; height: 8px;
    background: linear-gradient(135deg, #b8b0ff, #ff9ce0);
    transform: rotate(45deg);
    box-shadow: 0 0 12px rgba(180,150,255,0.9), 0 0 20px rgba(255,150,220,0.5);
    animation: diamondSpin 3s ease-in-out infinite;
  }
  @keyframes diamondSpin {
    0%,100% { transform: rotate(45deg) scale(1); }
    50% { transform: rotate(225deg) scale(1.3); }
  }

  /* GRID MAP */
  .map-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .map-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeInUp 0.7s ease backwards;
  }
  .map-item:nth-child(1) { animation-delay: 0.1s; }
  .map-item:nth-child(2) { animation-delay: 0.25s; }
  .map-item:nth-child(3) { animation-delay: 0.4s; }
  .map-item:nth-child(4) { animation-delay: 0.55s; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .map-card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.20);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s, border-color 0.4s;
  }

  .map-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.15), transparent 50%),
      repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.04) 10px, rgba(255,255,255,0.04) 11px);
    pointer-events: none;
  }

  .map-card::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
    transition: left 0.8s;
    pointer-events: none;
  }

  .map-card:hover::after { left: 100%; }
  .map-card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: rgba(140,120,255,0.8);
    box-shadow: 0 15px 40px rgba(106,92,255,0.6), 0 0 0 1px rgba(140,120,255,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
  }

  /* PLACEHOLDER MAP */
  .map-card .placeholder {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 16px;
  }

  .map-icon-wrap {
    width: 56px;
    height: 56px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.7));
    animation: iconFloat 3s ease-in-out infinite;
  }

  .map-icon-wrap svg {
    width: 100%;
    height: 100%;
  }

  @keyframes iconFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .map-card .placeholder .map-num {
    font-size: 13px;
    letter-spacing: 4px;
    font-weight: 900;
    opacity: 0.95;
    margin-bottom: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  .map-card .placeholder .map-label {
    font-size: 8px;
    letter-spacing: 3px;
    font-weight: 600;
    opacity: 0.7;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* Warna beda tiap map */
  .map-card.map-1 { background: linear-gradient(135deg, rgba(106,92,255,0.4), rgba(255,92,200,0.3)); }
  .map-card.map-2 { background: linear-gradient(135deg, rgba(255,92,200,0.4), rgba(0,212,255,0.3)); }
  .map-card.map-3 { background: linear-gradient(135deg, rgba(0,212,255,0.4), rgba(106,92,255,0.3)); }
  .map-card.map-4 { background: linear-gradient(135deg, rgba(255,156,92,0.4), rgba(255,92,92,0.3)); }

  /* TOMBOL ENTER */
  .btn-enter {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    overflow: hidden;
    background: linear-gradient(135deg, #6a5cff 0%, #00d4ff 100%);
    background-size: 200% 200%;
    box-shadow: 0 6px 18px rgba(0,212,255,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
    animation: btnGradient 4s ease infinite;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  @keyframes btnGradient {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .btn-enter::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
    transition: left 0.6s;
  }
  .btn-enter:hover::before { left: 100%; }
  .btn-enter:active { transform: scale(0.95); }
  @media (hover: hover) {
    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,212,255,0.7), inset 0 1px 0 rgba(255,255,255,0.4);
    }
  }
  .btn-enter svg { width: 14px; height: 14px; transition: transform 0.3s; }
  .btn-enter:hover svg { transform: translateX(4px); }

  .footer {
    text-align: center;
    margin-top: 30px;
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px;
  }

  /* POPUP PETUNJUK */
  .instruction-popup {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 10001;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s, visibility 0.4s;
  }
  .instruction-popup.show { opacity: 1; visibility: visible; }
  .instruction-card {
    background: linear-gradient(180deg, rgba(30, 30, 50, 0.95), rgba(15, 15, 30, 0.98));
    border: 1px solid rgba(140, 120, 255, 0.5);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(106, 92, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    animation: cardPopup 0.5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardPopup {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .instruction-icon {
    width: 60px; height: 60px;
    margin: 0 auto 16px;
    color: #6a5cff;
    filter: drop-shadow(0 0 20px rgba(106, 92, 255, 0.8));
    animation: iconPulse 2s ease-in-out infinite;
  }
  @keyframes iconPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .instruction-icon svg { width: 100%; height: 100%; }
  .instruction-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #b8b0ff, #ff9ce0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .instruction-text {
    font-size: 12px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .instruction-text strong {
    color: #b8b0ff;
    font-weight: 800;
    background: rgba(106, 92, 255, 0.15);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .instruction-close {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: linear-gradient(135deg, #6a5cff 0%, #ff5cc8 100%);
    background-size: 200% 200%;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(106, 92, 255, 0.4);
    animation: btnGradient 4s ease infinite;
    transition: transform 0.2s;
  }
  .instruction-close:active { transform: scale(0.97); }

  @media (max-width: 360px) {
    .map-grid { gap: 10px; }
    .wrap { padding: 16px 14px 30px; }
    .title { font-size: 17px; }
    .map-icon-wrap { width: 42px; height: 42px; }
    .map-card .placeholder .map-num { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">

  <a href="index.html" class="back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M11 18l-6-6 6-6"/>
    </svg>
    KEMBALI
  </a>

  <div class="title">ENTER MAP</div>
  <div class="subtitle">Pilih Map Zepeto</div>

  <div class="divider">
    <div class="line"></div>
    <div class="diamond"></div>
    <div class="line"></div>
  </div>

  <div class="map-grid" id="mapGrid"></div>

  <div class="footer">© VOID PROJECT — GENIX AREA</div>

</div>

<script>
  // ========== DATA MAP ==========
  const maps = [
    { 
      nama: 'Map 1', 
      id: 'cC09e3wK87dunnIpubYn0b1', 
      kelas: 'map-1',
      label: 'NIGHT CITY',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>'
    },
    { 
      nama: 'Map 2', 
      id: '44arM93UTDzT6xXxRyFefe', 
      kelas: 'map-2',
      label: 'BEACH SUNSET',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>'
    },
    { 
      nama: 'Map 3', 
      id: '2J9xQYV7fE6T69Vg9LL4Sj', 
      kelas: 'map-3',
      label: 'FOREST',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 12h3l-3 5h6v5h4v-5h6l-3-5h3z"/></svg>'
    },
    { 
      nama: 'Map 4', 
      id: 'PHniP3wK878sIYcAP37KUhf', 
      kelas: 'map-4',
      label: 'MOUNTAIN',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-12 4 7 3-4 5 9z"/><circle cx="8" cy="6" r="2"/></svg>'
    }
  ];

  // ========== RENDER MAP ==========
  const mapGrid = document.getElementById('mapGrid');

  maps.forEach((map) => {
    const item = document.createElement('div');
    item.className = 'map-item';

    item.innerHTML = `
      <div class="map-card ${map.kelas}">
        <div class="placeholder">
          <div class="map-icon-wrap">${map.icon}</div>
          <div class="map-num">${map.nama}</div>
          <div class="map-label">${map.label}</div>
        </div>
      </div>
      <button class="btn-enter" onclick="enterMap('${map.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        ENTER
      </button>
    `;

    mapGrid.appendChild(item);
  });

  // ========== KLIK ENTER MAP ==========
  function enterMap(id) {
    showToast('Membuka map...');
    setTimeout(() => {
      window.open('https://web.zepeto.me/en/detail/' + id + '?referrer=card_WorldBasic', '_blank');
      setTimeout(() => {
        showInstruction();
      }, 800);
    }, 400);
  }

  // ========== POPUP PETUNJUK ==========
  function showInstruction() {
    let popup = document.getElementById('instructionPopup');
    if (!popup) {
      popup = document.createElement('div');
      popup.id = 'instructionPopup';
      popup.className = 'instruction-popup';
      popup.innerHTML = `
        <div class="instruction-card">
          <div class="instruction-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4M12 8h.01"/>
            </svg>
          </div>
          <div class="instruction-title">MAP TERBUKA</div>
          <div class="instruction-text">
            Untuk masuk ke map Zepeto,<br>
            tap tombol <strong>"BUKA APLIKASI"</strong><br>
            di halaman yang baru terbuka.
          </div>
          <button class="instruction-close" onclick="closeInstruction()">
            MENGERTI
          </button>
        </div>
      `;
      document.body.appendChild(popup);
    }
    requestAnimationFrame(() => popup.classList.add('show'));
  }

  function closeInstruction() {
    const popup = document.getElementById('instructionPopup');
    if (popup) popup.classList.remove('show');
  }

  // ========== TOAST ==========
  let toastTimer;
  function showToast(text) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.style.cssText = `
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(120%);
        background: rgba(0,0,0,0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(106, 92, 255, 0.6);
        border-radius: 14px;
        padding: 12px 22px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #b8b0ff;
        z-index: 100;
        transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        pointer-events: none;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      `;
      document.body.appendChild(toast);
    }
    toast.textContent = text;
    toast.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.transform = 'translateX(-50%) translateY(120%)';
    }, 1800);
  }

  // ========== PARTIKEL BINTANG ==========
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 30; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDuration = (Math.random() * 8 + 6) + 's';
    star.style.animationDelay = Math.random() * 5 + 's';
    const size = (Math.random() * 2 + 1) + 'px';
    star.style.width = star.style.height = size;
    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
