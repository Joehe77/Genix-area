<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XBERTRON v8.0 — GENIX AREA</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    min-height: 100vh;
    background: #0a0a1a;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, #6a5cff 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, #ff5cc8 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, #00d4ff 0%, transparent 45%),
      #0a0a1a;
    z-index: -1;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 50px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #fff, #b8b0ff, #ff9ce0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px rgba(106, 92, 255, 0.5);
  }

  .header p {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* HERO GIF */
  .hero {
    padding: 10px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    margin-bottom: 22px;
    overflow: hidden;
  }

  .hero img {
    width: 100%;
    display: block;
    border-radius: 16px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* KARTU AVATAR */
  .card {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 22px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.20);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
    border-radius: 22px 22px 0 0;
    pointer-events: none;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 12px;
    position: relative;
    z-index: 1;
  }

  .card.aktif {
    border-color: rgba(140, 120, 255, 0.7);
    box-shadow:
      0 8px 32px rgba(106, 92, 255, 0.5),
      0 0 0 1px rgba(140, 120, 255, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  /* TOMBOL MASUK ZEPETO */
  .btn-zepeto {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #fff;
    text-transform: uppercase;

    background: linear-gradient(135deg, #6a5cff 0%, #ff5cc8 100%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      0 6px 18px rgba(106, 92, 255, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);

    transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
  }

  .btn-zepeto:active {
    transform: scale(0.95);
  }

  @media (hover: hover) {
    .btn-zepeto:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow:
        0 10px 24px rgba(106, 92, 255, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
  }

  .btn-zepeto svg {
    width: 14px;
    height: 14px;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 3px;
  }

  @media (max-width: 360px) {
    .grid { gap: 10px; }
    .container { padding: 20px 14px 40px; }
    .header h1 { font-size: 20px; }
    .btn-zepeto { font-size: 10px; padding: 9px 8px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>XBERTRON v8.0</h1>
    <p>GENIX AREA</p>
  </div>

  <div class="hero">
    <img src="gif-atas.gif" alt="Hero GIF">
  </div>

  <div class="grid">

    <!-- ITEM 1 -->
    <div class="item">
      <div class="card aktif">
        <img src="gambar1.png" alt="Avatar 1">
      </div>
      <a href="zepeto://zepeto.me/KODE1" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE1')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

    <!-- ITEM 2 -->
    <div class="item">
      <div class="card">
        <img src="gambar2.png" alt="Avatar 2">
      </div>
      <a href="zepeto://zepeto.me/KODE2" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE2')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

    <!-- ITEM 3 -->
    <div class="item">
      <div class="card">
        <img src="gambar3.png" alt="Avatar 3">
      </div>
      <a href="zepeto://zepeto.me/KODE3" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE3')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

    <!-- ITEM 4 -->
    <div class="item">
      <div class="card">
        <img src="gambar4.png" alt="Avatar 4">
      </div>
      <a href="zepeto://zepeto.me/KODE4" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE4')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

  </div>

  <div class="footer">© XBERTRON v8.0 — GENIX AREA</div>

</div>

<script>
  // Fallback: kalau app Zepeto gak ada, buka versi web
  function fallbackZepeto(e, kode) {
    const waktu = Date.now();
    setTimeout(() => {
      if (Date.now() - waktu < 1500 && !document.hidden) {
        window.location.href = "https://zepeto.me/" + kode;
      }
    }, 800);
  }
</script>

</body>
    </html>
