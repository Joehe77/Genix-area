<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XBERTRON v8.0 — GENIX AREA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    min-height: 100vh;
    background: #0a0a1a;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* BACKGROUND BERGERAK */
  body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 15% 20%, #6a5cff 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, #ff5cc8 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, #00d4ff 0%, transparent 45%),
      #0a0a1a;
    z-index: -2;
    animation: bgMove 15s ease-in-out infinite alternate;
  }

  @keyframes bgMove {
    0%   { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-3%, -3%) rotate(3deg); }
  }

  /* PARTIKEL BINTANG */
  .stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.6;
    animation: floatUp linear infinite;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
  }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 50px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #fff, #b8b0ff, #ff9ce0, #fff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleGlow 4s ease-in-out infinite, gradientFlow 6s linear infinite;
  }

  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(106, 92, 255, 0.6)); }
    50%      { filter: drop-shadow(0 0 25px rgba(255, 92, 200, 0.9)); }
  }

  @keyframes gradientFlow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .header p {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
    animation: fadeIn 1.2s ease 0.3s backwards;
  }

  /* HERO GIF */
  .hero {
    padding: 10px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    margin-bottom: 22px;
    overflow: hidden;
    animation: fadeInUp 0.8s ease backwards;
    animation-delay: 0.2s;
    transition: transform 0.4s, box-shadow 0.4s;
  }

  .hero:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 45px rgba(106, 92, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .hero img {
    width: 100%;
    display: block;
    border-radius: 16px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .item {
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeInUp 0.7s ease backwards;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  }

  .item:nth-child(1) { animation-delay: 0.4s; }
  .item:nth-child(2) { animation-delay: 0.55s; }
  .item:nth-child(3) { animation-delay: 0.7s; }
  .item:nth-child(4) { animation-delay: 0.85s; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* KARTU AVATAR */
  .card {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 22px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.20);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s, border-color 0.4s;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
    border-radius: 22px 22px 0 0;
    pointer-events: none;
  }

  /* SHINE EFFECT - kilau menyapu */
  .card::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
    transition: left 0.8s;
    pointer-events: none;
    z-index: 2;
  }

  .card:hover::after {
    left: 100%;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 12px;
    position: relative;
    z-index: 1;
    transition: transform 0.5s;
  }

  .card:hover img {
    transform: scale(1.06);
  }

  .card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: rgba(140, 120, 255, 0.8);
    box-shadow:
      0 15px 40px rgba(106, 92, 255, 0.6),
      0 0 0 1px rgba(140, 120, 255, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  .card.aktif {
    border-color: rgba(140, 120, 255, 0.7);
    box-shadow:
      0 8px 32px rgba(106, 92, 255, 0.5),
      0 0 0 1px rgba(140, 120, 255, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    animation: cardPulse 3s ease-in-out infinite;
  }

  @keyframes cardPulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(106, 92, 255, 0.5), 0 0 0 1px rgba(140, 120, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
    50%      { box-shadow: 0 8px 40px rgba(140, 120, 255, 0.8), 0 0 0 2px rgba(140, 120, 255, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
  }

  /* TOMBOL MASUK */
  .btn-zepeto {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #fff;
    text-transform: uppercase;
    overflow: hidden;

    background: linear-gradient(135deg, #6a5cff 0%, #ff5cc8 100%);
    background-size: 200% 200%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      0 6px 18px rgba(106, 92, 255, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);

    animation: btnGradient 4s ease infinite;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  @keyframes btnGradient {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .btn-zepeto::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
    transition: left 0.6s;
  }

  .btn-zepeto:hover::before {
    left: 100%;
  }

  .btn-zepeto:active {
    transform: scale(0.95);
  }

  @media (hover: hover) {
    .btn-zepeto:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 28px rgba(106, 92, 255, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
  }

  .btn-zepeto svg {
    width: 14px;
    height: 14px;
    transition: transform 0.3s;
  }

  .btn-zepeto:hover svg {
    transform: translateX(4px);
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 3px;
    animation: fadeIn 1.5s ease 1s backwards;
  }

  @media (max-width: 360px) {
    .grid { gap: 10px; }
    .container { padding: 20px 14px 40px; }
    .header h1 { font-size: 20px; }
    .btn-zepeto { font-size: 10px; padding: 9px 8px; }
  }
</style>
</head>
<body>

<!-- PARTIKEL BINTANG -->
<div class="stars" id="stars"></div>

<div class="container">

  <div class="header">
    <h1>XBERTRON v8.0</h1>
    <p>GENIX AREA</p>
  </div>

  <div class="hero">
    <img src="gif-atas.gif" alt="Hero GIF">
  </div>

  <div class="grid">

    <div class="item">
      <div class="card aktif">
        <img src="gambar1.png" alt="Avatar 1">
      </div>
      <a href="zepeto://zepeto.me/KODE1" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE1')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

    <div class="item">
      <div class="card">
        <img src="gambar2.png" alt="Avatar 2">
      </div>
      <a href="zepeto://zepeto.me/KODE2" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE2')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

    <div class="item">
      <div class="card">
        <img src="gambar3.png" alt="Avatar 3">
      </div>
      <a href="zepeto://zepeto.me/KODE3" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE3')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

    <div class="item">
      <div class="card">
        <img src="gambar4.png" alt="Avatar 4">
      </div>
      <a href="zepeto://zepeto.me/KODE4" class="btn-zepeto" onclick="fallbackZepeto(event, 'KODE4')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        MASUK
      </a>
    </div>

  </div>

  <div class="footer">© XBERTRON v8.0 — GENIX AREA</div>

</div>

<script>
  // Fallback Zepeto
  function fallbackZepeto(e, kode) {
    const waktu = Date.now();
    setTimeout(() => {
      if (Date.now() - waktu < 1500 && !document.hidden) {
        window.location.href = "https://zepeto.me/" + kode;
      }
    }, 800);
  }

  // Bikin partikel bintang otomatis
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 30; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDuration = (Math.random() * 8 + 6) + 's';
    star.style.animationDelay = Math.random() * 5 + 's';
    star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
